<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard — MOVT APP</title>
  <meta name="theme-color" content="#121212" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="/img/brand/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@500,700,900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500&family=Wix+Madefor+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles/global.css" />
  <link rel="stylesheet" href="/styles/dashboard.css" />
  <link rel="stylesheet" href="/styles/dashboard-views.css" />
  <!-- Sem sessão → login, antes de renderizar (script externo por causa da CSP) -->
  <script src="/scripts/auth-guard.js"></script>
</head>
<body class="dash">
  <a class="skip" href="#view">Pular para o conteúdo</a>

  <!-- ================= SIDEBAR ================= -->
  <aside class="side" id="side">
    <div class="side-head">
      <a href="/" class="side-logo" aria-label="MOVT — site">
        <img class="side-word" src="/img/brand/logo.png" alt="MOVT" width="120" height="34" />
        <img class="side-mark" src="/img/brand/favicon.png" alt="" width="30" height="30" />
      </a>
      <!-- Recolher/expandir (desktop). Atalho: Ctrl+B -->
      <button class="side-toggle" id="side-toggle" aria-controls="side" aria-expanded="true" aria-label="Recolher menu" data-tip="Recolher menu · Ctrl+B">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3.5" width="18" height="17" rx="3"/><path d="M9 3.5v17"/><path class="chev" d="M15.5 9.5 13 12l2.5 2.5"/></svg>
      </button>
    </div>
    <nav class="side-nav" aria-label="Seções do painel">
      <a href="/dashboard" data-link data-nav="inicio" data-tip="Início"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span class="lbl">Início</span></a>
      <a href="/dashboard/treinos" data-link data-nav="treinos" data-tip="Treinos"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg><span class="lbl">Treinos</span></a>
      <a href="/dashboard/agenda" data-link data-nav="agenda" data-tip="Agenda"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg><span class="lbl">Agenda</span></a>
      <a href="/dashboard/plano" data-link data-nav="plano" data-tip="Meu plano"><svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.6 7L12 17.5 5.8 21.2l1.6-7L2 9.5l7.1-.6z"/></svg><span class="lbl">Meu plano</span></a>
      <a href="/dashboard/comunidade" data-link data-nav="comunidade" data-tip="Comunidade"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14.2A6.5 6.5 0 0 1 21.5 20"/></svg><span class="lbl">Comunidade</span></a>
    </nav>
    <div class="side-app">
      <p>Use o MOVT completo no celular</p>
      <a href="/#download" class="btn btn-sm">Baixar app</a>
    </div>
    <a href="/#download" class="side-app-mini" data-tip="Baixar app" aria-label="Baixar app"><svg viewBox="0 0 24 24"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg></a>
    <button class="side-logout" data-logout data-tip="Sair"><svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l-5-5 5-5M5 12h12"/></svg><span class="lbl">Sair</span></button>
  </aside>
  <div class="side-scrim" hidden></div>
  <!-- Nome do item ao passar o mouse com o sidebar recolhido (fora do <aside>, que rola) -->
  <div class="side-tip" id="side-tip" role="tooltip" hidden></div>

  <!-- ================= MAIN ================= -->
  <div class="main">
    <header class="top">
      <button class="top-burger" aria-label="Abrir menu" aria-controls="side" aria-expanded="false"><span></span><span></span><span></span></button>
      <div class="top-hello">
        <p class="top-date" id="top-eyebrow"></p>
        <h1 id="top-title" tabindex="-1">Olá, <span class="grad" id="user-first">atleta</span> 👋</h1>
      </div>
      <div class="top-user">
        <span class="plan-badge" id="plan-badge" hidden></span>
        <button class="avatar" id="avatar-btn" aria-label="Menu da conta" aria-haspopup="menu" aria-expanded="false"><span id="avatar-initials">M</span></button>
        <div class="user-menu" id="user-menu" role="menu" hidden>
          <p class="um-name" id="um-name"></p>
          <p class="um-email" id="um-email"></p>
          <a href="/dashboard/plano" data-link role="menuitem">Meu plano</a>
          <a href="/" role="menuitem">Voltar ao site</a>
          <button role="menuitem" data-logout>Sair da conta</button>
        </div>
      </div>
    </header>

    <div class="banner" id="verify-banner" hidden>
      <span>Sua conta ainda não foi verificada. Conclua a verificação pelo app para liberar todos os recursos.</span>
    </div>

    <!-- Cada tela do painel é desenhada aqui pelo roteador (js/pages/dashboard/router.js) -->
    <main id="view" class="view" tabindex="-1" aria-live="polite"></main>

    <footer class="dash-foot">© 2026 – MOVT APP LTDA.</footer>
  </div>

  <!-- Detalhe (treino, post, comunidade) -->
  <dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
    <div class="sheet-img"><img id="sheet-img" alt="" /></div>
    <div class="sheet-body">
      <p class="eyebrow" id="sheet-cat"></p>
      <h3 id="sheet-title"></h3>
      <div class="sheet-meta" id="sheet-meta"></div>
      <p class="sheet-desc" id="sheet-desc"></p>
      <div class="sheet-extra" id="sheet-extra"></div>
      <div class="sheet-actions" id="sheet-actions"></div>
    </div>
  </dialog>

  <!-- Confirmação de ações -->
  <dialog class="confirm" id="confirm" aria-labelledby="confirm-title">
    <h3 id="confirm-title"></h3>
    <p id="confirm-text"></p>
    <div class="confirm-actions">
      <button class="btn btn-ghost" value="cancel" data-confirm="no">Voltar</button>
      <button class="btn" value="ok" data-confirm="yes" id="confirm-ok">Confirmar</button>
    </div>
  </dialog>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <script type="module" src="/js/pages/dashboard/index.js"></script>
</body>
</html>
